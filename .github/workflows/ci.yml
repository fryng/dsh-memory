name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build host + client bundles
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Bundle sanity
        shell: bash
        run: |
          test -s lib/index.js
          test -s lib/client.js
          grep -q "__ModuleLoader__" lib/client.js
